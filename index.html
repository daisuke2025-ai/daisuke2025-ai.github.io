<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マヌルネコ増殖計画</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Google Analytics 4 -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-3PTZ52XG39"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());

      gtag("config", "G-3PTZ52XG39");
    </script>
  </head>
  <body>
    <main>
      <h1>マヌルネコ増殖計画</h1>
      <p>世界をマヌルネコで埋め尽くせ！</p>

      <h2>
        現在のマヌルネコ：
        <span id="count">0</span>匹
      </h2>

      <p>1クリック：+<span id="power">1</span>匹</p>

      <button id="manulButton" type="button">
        <img src="manul.png" alt="マヌルネコ" />
      </button>

      <p>マヌルネコをクリックして増殖させよう！</p>

      <section class="shop">
        <h2>マヌルPOWERがアップ！</h2>
        <p>🥫 高級マヌル缶</p>
        <p>購入するとクリック増殖力が+1！</p>

        <button id="buyButton" type="button" disabled>10匹で購入</button>
      </section>

      <section class="shop">
        <h2>自動マヌル増殖装置</h2>

        <p>現在の装置：<span id="autoCount">0</span>台</p>
        <p>毎秒 +<span id="autoPower">0</span>匹</p>

        <button id="autoBuyButton" type="button" disabled>30匹で購入</button>
      </section>

      <p id="message"></p>

      <button id="settingsButton">⚙️ 設定</button>

      <div id="soundSettings" class="sound-settings" hidden>
        <h2>🎵 サウンド設定</h2>

        <div class="setting-row">
          <span>BGM</span>
          <button id="bgmButton">🔇 OFF</button>
        </div>

        <div class="volume-setting">
          <label for="bgmVolume">BGM音量</label>
          <input type="range" id="bgmVolume" min="0" max="100" value="30" />
          <span id="volumeValue">30%</span>
        </div>

        <p class="settings-note">設定は自動で保存されます。</p>
      </div>

      <button id="resetButton" type="button">リセット</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
